name: Go tests

on:
  push:
    branches: [main, feat/eagle-hash-duplicate-guard]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: Resolve modules
        run: |
          go mod tidy
          git diff --exit-code -- go.mod go.sum
      - name: Test
        run: go test -race ./...
      - name: Verify formatting
        run: |
          gofmt -d eagle_hash_index*.go eagle_integration.go process_state.go source_type.go command_dispatch.go state_store.go models.go VRCSSAnnotationTool.go
          test -z "$(gofmt -l eagle_hash_index*.go eagle_integration.go process_state.go source_type.go command_dispatch.go state_store.go models.go VRCSSAnnotationTool.go)"
